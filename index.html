<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';
import { gsap } from 'gsap';

/* =====================================================================
   0. Tokens + config (style objects, no CSS soup)
===================================================================== */
const params = new URLSearchParams(location.search);
const STILL = params.has('still'); // deterministic mode for agents / screenshots
// Quality: ?quality=low|high. Auto-low on weak mobile GPUs (e.g. Adreno 3xx-5xx, Mali-4xx/T, PowerVR) so phones like the Galaxy M02s stay smooth.
const LOW = (() => {
  const q = params.get('quality'); if (q) return q === 'low';
  try { const gl = document.createElement('canvas').getContext('webgl'); const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
    const r = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
    return /Adreno \(TM\) [345]\d\d|Mali-(4|T)|PowerVR/i.test(r) || (navigator.deviceMemory && navigator.deviceMemory <= 2);
  } catch { return false; }
})();
const SEG = LOW ? 0.5 : 1; // geometry detail multiplier

// Tokens lifted from shifatmasud-framer.vercel.app
const Tokens = {
  ink: '#121315', paper: '#fafafa', muted: '#5f646b', muted2: '#a9adb3',
  hairline: 'rgba(18, 19, 21, 0.07)',
  font: 'Inter, "Inter Placeholder", -apple-system, sans-serif', tracking: '-0.02em',
};

const Theme = {
  backdrop: { light: Tokens.paper, dark: '#000000' }, // dark = pure black, 1:1 with Apple's product shots
  colorways: { titanium: '#8a8781', silver: '#d6d6d8', ink: '#2a2c30', cosmic: '#dc7c46', shade: '#d81b60', peach: '#ffb08a' },
  angles: {
    hero:  { azimuth: 150, elevation: 8 },
    front: { azimuth: 20,  elevation: 4 },
    back:  { azimuth: 180, elevation: 4 },
    side:  { azimuth: 95,  elevation: 2 },
    top:   { azimuth: 160, elevation: 60 },
    closeup: { azimuth: 180, elevation: -30, dist: 0.55, lift: 0.26, fov: 38, key: 0.78 }, // fit to Apple's camera close-up (low, looking up the back at the plateau)
  },
  fov: 18,
  floatBase: 0.06,
};

const Skin = {
  dark: {
    sheetBg: 'rgba(28, 29, 32, 0.78)', sheetBorder: 'rgba(250, 250, 250, 0.08)', text: Tokens.paper,
    hover: 'rgba(250, 250, 250, 0.08)', activeBg: Tokens.paper, activeText: Tokens.ink,
    grip: 'rgba(250, 250, 250, 0.22)', swatchRing: 'rgba(250, 250, 250, 0.18)', swatchOn: Tokens.paper,
    hint: Tokens.muted2, track: 'rgba(250, 250, 250, 0.06)',
    primaryBg: Tokens.paper, primaryText: Tokens.ink, shadow: '0 20px 60px rgba(0, 0, 0, 0.5)',
  },
  light: {
    sheetBg: 'rgba(250, 250, 250, 0.82)', sheetBorder: Tokens.hairline, text: Tokens.ink,
    hover: Tokens.hairline, activeBg: Tokens.ink, activeText: Tokens.paper,
    grip: 'rgba(18, 19, 21, 0.16)', swatchRing: 'rgba(18, 19, 21, 0.12)', swatchOn: Tokens.ink,
    hint: Tokens.muted, track: 'rgba(18, 19, 21, 0.05)',
    primaryBg: Tokens.ink, primaryText: Tokens.paper, shadow: '0 20px 60px rgba(18, 19, 21, 0.12)',
  },
};

const Style = {
  sheet: {
    position: 'fixed', left: '50%', bottom: '12px', width: 'min(400px, calc(100vw - 24px))',
    boxSizing: 'border-box', borderRadius: '22px', overflow: 'hidden', zIndex: 10,
    backdropFilter: 'blur(28px) saturate(1.5)', WebkitBackdropFilter: 'blur(28px) saturate(1.5)',
    font: `500 13px/1 ${Tokens.font}`, letterSpacing: Tokens.tracking, userSelect: 'none',
    transition: 'background .5s, color .5s, border-color .5s, box-shadow .5s', willChange: 'transform',
  },
  header: { padding: '8px 16px 14px', cursor: 'grab', touchAction: 'none', outline: 'none' },
  grip: { width: '36px', height: '5px', borderRadius: '3px', margin: '0 auto 12px', transition: 'background .5s, width .3s' },
  headRow: { display: 'flex', alignItems: 'center', justifyContent: 'space-between' },
  title: { font: `600 15px/1 ${Tokens.font}`, letterSpacing: '-0.035em' },
  summary: { font: `500 12px/1 ${Tokens.font}`, opacity: 0.6, textTransform: 'capitalize' },
  body: { padding: '2px 16px 16px', display: 'flex', flexDirection: 'column', gap: '14px' },
  group: { display: 'flex', flexDirection: 'column', gap: '8px' },
  label: { font: `500 11px/1 ${Tokens.font}`, letterSpacing: '0.06em', textTransform: 'uppercase', opacity: 0.55 },
  segment: { display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: '2px', padding: '3px', borderRadius: '12px' },
  swatchRow: { display: 'flex', gap: '10px', alignItems: 'center', padding: '2px' },
  actions: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px' },
  btn: {
    border: 'none', background: 'transparent', cursor: 'pointer', color: 'inherit',
    padding: '9px 0', borderRadius: '9px', font: 'inherit', letterSpacing: 'inherit', textAlign: 'center',

  },
  primary: {
    border: 'none', cursor: 'pointer', padding: '12px 0', borderRadius: '12px',
    font: `600 13px/1 ${Tokens.font}`, letterSpacing: Tokens.tracking,
    transition: 'transform .35s cubic-bezier(.34,1.56,.64,1), background .4s, color .4s',
  },
  swatch: {
    width: '20px', height: '20px', borderRadius: '50%', cursor: 'pointer', padding: 0, margin: '0 3px',
    borderWidth: '2px', borderStyle: 'solid',

  },
  flash: { position: 'fixed', inset: 0, background: Tokens.paper, opacity: 0, pointerEvents: 'none', zIndex: 20 },
  wordmark: {
    position: 'fixed', top: '22px', left: '24px', zIndex: 10, pointerEvents: 'none',
    font: `600 15px/1 ${Tokens.font}`, letterSpacing: '-0.035em', transition: 'color .5s',
  },
  hint: {
    position: 'fixed', top: '24px', right: '24px', zIndex: 10, pointerEvents: 'none',
    font: `500 12px/1 ${Tokens.font}`, letterSpacing: Tokens.tracking, transition: 'opacity 1s, color .5s',
  },
};
function make(tag, style, props = {}) {
  const n = Object.assign(document.createElement(tag), props);
  Object.assign(n.style, style);
  return n;
}

/* =====================================================================
   1. Renderer
===================================================================== */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, LOW ? 1 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping; // ref check: AgX muddied cosmic orange; Neutral keeps Apple's hues true
const EXPOSURE = 0.68;
renderer.toneMappingExposure = EXPOSURE;
renderer.shadowMap.enabled = !LOW; // low: dark mode shows no shadow anyway
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(Theme.fov, innerWidth / innerHeight, 0.05, 100);

/* =====================================================================
   2. Three-point lighting: KEY, FILL, RIM (the only lights in the scene)
      Camera sits on +Z in this frame. The rig follows the camera azimuth.
===================================================================== */
const ThreePoint = {
  // Positions/aims fit numerically to Apple's cosmic orange back shot (18+ tuning passes, SwiftShader renders vs ref)
  key:  { name: 'key',  pos: [-0.4, 1.0, 0.8],  aim: [0, 0, 0], size: [1.8, 1.8],  intensity: 6 },   // close above the top edge: Apple's top-to-bottom falloff
  fill: { name: 'fill', pos: [0.2, 1.6, 2.6],   size: [2.6, 2.6],  intensity: 1.5, grade: 0.6 }, // big frontal-top card, hotter at the top: glass reflection falls off downward
  rim:  { name: 'rim',  pos: [-2.2, 1.2, -1.0], size: [0.35, 2.6], intensity: 16 },  // left-behind strip: lights the left frame edge like the ref
};
const ModeRecipe = {
  dark:  { room: 0.3, floor: 0.0, key: 0.35, fill: 0.2, rim: 1.3, mirror: 2.2, envSize: 2.4 }, // warm dim room = warm (not black) shadows, 1:1 with ref
  light: { room: 0.18, floor: 0.35, key: 0.8, fill: 1.0, rim: 0.7, mirror: 1.6 },
};

// Softbox diffusion: bright core, feathered edges. `grade` = top-to-bottom falloff of the panel
// (real gridded strip boxes are hotter at the top); reflections of a graded box give Apple's glass falloff.
const softboxCache = {};
function softbox(grade = 0) {
  if (softboxCache[grade]) return softboxCache[grade];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const img = g.createImageData(256, 256);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const u = Math.abs(x / 127.5 - 1), v = Math.abs(y / 127.5 - 1);
    const e = Math.pow(1 - Math.max(u, v) ** 6, 1.5) * (0.75 + 0.25 * (1 - v * v)) * (1 - grade * (y / 255));
    const i = (y * 256 + x) * 4; img.data[i] = img.data[i + 1] = img.data[i + 2] = 255 * e; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return (softboxCache[grade] = t);
}

// Reflections show the SAME three softboxes (one source of truth)
function buildStudioEnv(mode) {
  const r = ModeRecipe[mode];
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20),
    new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(r.room), side: THREE.BackSide })));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(r.floor) }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -3;
  env.add(floor);
  Object.values(ThreePoint).forEach((L) => {
    const p = new THREE.Vector3(...L.pos), s = (7 / p.length()) * (r.envSize ?? 1.8);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(L.size[0] * s, L.size[1] * s),
      new THREE.MeshBasicMaterial({ map: softbox(L.grade ?? 0), color: new THREE.Color().setScalar(L.intensity * r.mirror * r[L.name]), side: THREE.DoubleSide }));
    m.position.copy(p.normalize().multiplyScalar(7));
    m.lookAt(0, 0, 0);
    env.add(m);
  });
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(env, 0.02).texture;
  pmrem.dispose();
  return tex;
}

RectAreaLightUniformsLib.init();
const rig = new THREE.Group();
scene.add(rig);
const lights = {};
Object.values(ThreePoint).forEach((L) => {
  const l = new THREE.RectAreaLight(0xffffff, L.intensity, L.size[0], L.size[1]);
  l.position.set(...L.pos);
  l.lookAt(...(L.aim ?? [0, 0, 0]));
  l.userData.base = L.intensity;
  rig.add(l);
  lights[L.name] = l;
});
function syncRig() {
  rig.position.copy(target);
  const az = Math.atan2(camera.position.x - target.x, camera.position.z - target.z);
  rig.rotation.y = az;
  scene.environmentRotation.set(0, az, 0);
}

// Shadow caster only (intensity 0): no added light, just the soft contact shadow
const shadowCaster = new THREE.DirectionalLight(0xffffff, 0);
shadowCaster.position.set(-0.6, 6, 0.6);
shadowCaster.castShadow = true;
shadowCaster.shadow.mapSize.set(LOW ? 512 : 2048, LOW ? 512 : 2048);
shadowCaster.shadow.radius = 18;
shadowCaster.shadow.blurSamples = 24;
Object.assign(shadowCaster.shadow.camera, { left: -1.2, right: 1.2, top: 1.2, bottom: -1.2, near: 1, far: 12 });
scene.add(shadowCaster);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const envMaps = { light: buildStudioEnv('light'), dark: buildStudioEnv('dark') };

// Cinematic post: soft bloom on specular hits only + lens vignette, then AgX tone map / sRGB in OutputPass
const composer = new EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.0, 0.2, 0.98); // only the hottest glints glow (ref has no halo)
// bloom off (Apple's shot has no halo); pass kept out of the chain for performance
const vignette = new ShaderPass(VignetteShader);
vignette.uniforms.offset.value = 1.0;
vignette.uniforms.darkness.value = 1.15;
composer.addPass(vignette);
composer.addPass(new OutputPass());

/* =====================================================================
   3. Materials
===================================================================== */
// Bead-blast micro texture: fine noise in roughness so highlights break up like real anodized aluminum / etched glass
function grainTex(base, spread, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256);
  let s = 1337; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 255 * THREE.MathUtils.clamp(base + (rnd() - 0.5) * spread, 0, 1);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.NoColorSpace; // data texture (roughness): linear, never sRGB-decoded
  return t;
}
const bead = grainTex(0.85, 0.35, 6);   // multiplies material roughness
const etch = grainTex(0.9, 0.25, 10);

const M = {
  // Anodized aluminum unibody: true metal, satin bead-blast, color lives in the reflections (Apple's look)
  // (ref check: Apple's anodized color reads bright and saturated, so keep a strong diffuse share; metal shows in the edge highlights)
  body:    new THREE.MeshPhysicalMaterial({ color: Theme.colorways.titanium, metalness: 0.0, roughness: 0.32, roughnessMap: bead, anisotropy: 0.3, clearcoat: 0.2, clearcoatRoughness: 0.12, envMapIntensity: 2.3 }), // fit to ref
  // Ceramic Shield back: etched/frosted body under a thin glossy top layer -> soft sheen + a crisp streak
  back:    new THREE.MeshPhysicalMaterial({ color: Theme.colorways.titanium, metalness: 0, roughness: 0.5, roughnessMap: etch, clearcoat: 0.3, clearcoatRoughness: 0.22, envMapIntensity: 0.4 }), // fit to ref: frosted; reflects the graded fill for the top-to-bottom falloff
  logo:    new THREE.MeshPhysicalMaterial({ color: Theme.colorways.titanium, metalness: 0.25, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 0.15 }),
  ring:    new THREE.MeshPhysicalMaterial({ color: Theme.colorways.titanium, metalness: 1, roughness: 0.1, anisotropy: 0.6, envMapIntensity: 1.2 }), // diamond-cut, follows colorway
  lensCore:new THREE.MeshPhysicalMaterial({ color: '#1c2848', metalness: 0.5, roughness: 0.08, clearcoat: 1, iridescence: 0.6, iridescenceIOR: 1.6 }),
  // Sapphire cover with AR coating: deep black with violet/teal flicker at grazing angles
  lens:    new THREE.MeshPhysicalMaterial({ color: '#030406', metalness: 0, roughness: 0.02, clearcoat: 1, clearcoatRoughness: 0, iridescence: 0.3, iridescenceIOR: 1.8, envMapIntensity: 0.6 }),
  lensIn:  new THREE.MeshPhysicalMaterial({ color: '#050608', metalness: 0.2, roughness: 0.35, envMapIntensity: 0.3 }),
  sapphire:new THREE.MeshPhysicalMaterial({ color: '#202126', metalness: 0.1, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02 }),
  screen:  new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false }), // unlit: only its own light
  island:  new THREE.MeshBasicMaterial({ color: 0x000000 }),                     // Dynamic Island, unlit black
  bezel:   new THREE.MeshPhysicalMaterial({ color: '#000000', metalness: 0, roughness: 0.3 }),
  hole:    new THREE.MeshBasicMaterial({ color: '#050505' }),
  flash:   new THREE.MeshPhysicalMaterial({ color: '#f1ead6', roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.1 }),
  window:  new THREE.MeshPhysicalMaterial({ color: '#3a3b3f', metalness: 0, roughness: 0.4, clearcoat: 1, clearcoatRoughness: 0.2 }),
};
const tinted = [M.body, M.back, M.logo, M.ring]; // follow the colorway
// Camera plateau: same anodized finish, tuned separately (in the ref it faces the camera and reads darker than the frame edge)
M.plateau = M.body.clone(); M.plateau.envMapIntensity = 0.5; M.plateau.clearcoat = 0.0;
tinted.push(M.plateau);
if (LOW) { M.lensCore.iridescence = 0; M.lens.iridescence = 0; } // iridescence is the costliest lens term

/* =====================================================================
   4. Geometry primitives
===================================================================== */
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);     s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);     s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);         s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function slab({ w, h, d, corner, bevel = 0.015, bevelSegments = 12 }) {
  let g = new THREE.ExtrudeGeometry(
    roundedRect(w - 2 * bevel, h - 2 * bevel, Math.max(corner - bevel, 0.001)),
    { depth: Math.max(d - 2 * bevel, 0.0001), bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: Math.max(3, Math.round(bevelSegments * SEG)), curveSegments: Math.round(48 * SEG) }
  );
  g.center();
  // Smooth subdivision look: blend normals across the bevel/corner facets (< 35 deg) so edges roll off
  // continuously like machined aluminum, while true hard breaks stay crisp
  g = toCreasedNormals(g, THREE.MathUtils.degToRad(35));
  return g;
}
const flat = (w, h, r, mat, seg = 32) => new THREE.Mesh(new THREE.ShapeGeometry(roundedRect(w, h, r), seg), mat);
const disc = (r, mat, seg = 24) => new THREE.Mesh(new THREE.CircleGeometry(r, seg), mat);

// Apple logo from SVG path (24x24 viewBox), scaled to `width`, centered, Y flipped from SVG space
const APPLE_PATH = 'M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701';
function appleLogo(width, mat) {
  const data = new SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="${APPLE_PATH}"/></svg>`);
  const shapes = data.paths.flatMap((p) => SVGLoader.createShapes(p));
  const geo = new THREE.ShapeGeometry(shapes, 24);
  geo.scale(1, -1, 1);
  // the -Y mirror flips triangle winding; swap back so the logo is lit from the correct side
  const idx = geo.index.array;
  for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
  geo.index.needsUpdate = true;
  geo.computeBoundingBox();
  const bb = geo.boundingBox, s = width / (bb.max.x - bb.min.x);
  geo.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, 0);
  geo.scale(s, s, 1);
  return new THREE.Mesh(geo, mat);
}

function wallpaper(w, h) {
  const c = make('canvas', {}, { width: 512, height: Math.round(512 * h / w) });
  const g = c.getContext('2d');
  const t = new THREE.CanvasTexture(c);
  const draw = () => {
  // Ultra-minimal: near-black graphite field, one barely-there light falloff from the top, a thin clock. Nothing else.
  const base = g.createLinearGradient(0, 0, 0, c.height);
  base.addColorStop(0, '#1a1b1e');
  base.addColorStop(0.55, '#0c0c0e');
  base.addColorStop(1, '#060607');
  g.fillStyle = base; g.fillRect(0, 0, c.width, c.height);
  const glow = g.createRadialGradient(c.width * 0.5, -c.height * 0.1, 0, c.width * 0.5, -c.height * 0.1, c.height * 0.75);
  glow.addColorStop(0, 'rgba(255, 255, 255, 0.07)');
  glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
  g.fillStyle = glow; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = 'rgba(250, 250, 250, 0.9)';
  g.textAlign = 'center';
  g.font = `200 ${Math.round(c.width * 0.2)}px Inter, -apple-system, sans-serif`;
  g.fillText('9:41', c.width / 2, c.height * 0.19);
  };
  draw();

  document.fonts?.load(`200 ${Math.round(c.width * 0.2)}px Inter`).then(() => { draw(); t.needsUpdate = true; }).catch(() => {});

/* =====================================================================
   5. Default product: phone with Apple-style details
      Front faces +Z. Seen from the back, +X appears on the LEFT.
===================================================================== */
function buildPhone() {
  const W = 0.72, H = 1.47, D = 0.078, C = 0.12;
  const zF = D / 2, zB = -D / 2;
  const g = new THREE.Group();

  // Unibody
  g.add(new THREE.Mesh(slab({ w: W, h: H, d: D, corner: C, bevel: 0.022, bevelSegments: 14 }), M.body));

  // ---- Front ----
  const bezel = flat(W - 0.024, H - 0.024, C - 0.012, M.bezel, 64);
  bezel.position.z = zF + 0.0006; g.add(bezel);
  const sw = W - 0.05, sh = H - 0.05;
  M.screen.map = wallpaper(sw, sh);
  const screen = flat(sw, sh, C - 0.025, M.screen, 64);
  screen.position.z = zF + 0.0012; g.add(screen);
  const island = flat(0.17, 0.05, 0.025, M.island);               // Dynamic Island
  island.position.set(0, H / 2 - 0.085, zF + 0.0016); g.add(island);
  const ear = flat(0.11, 0.005, 0.0025, M.hole);                   // earpiece slit
  ear.position.set(0, H / 2 - 0.018, zF + 0.0016); g.add(ear);

  // ---- Back (measured from Apple's official iPhone 17 Pro product images) ----
  // Image coords -> model: fx = fraction from left of the BACK view, fy = fraction from top.
  // Seen from the back, image-left is +X.
  const bx = (fx) => W / 2 - fx * W;
  const by = (fy) => H / 2 - fy * H;

  // Full-width aluminum camera plateau: top ~29% of the back, soft step at its lower edge
  // Inset like Apple's: same left/right margin as the glass panel (logo container), so their edges line up.
  // Measured on the ref: plateau top ~2.15% of the height below the frame top, lower edge at ~28.9%.
  const gw = W * 0.888, pTop = 0.0215, pBot = 0.289;
  const PH = (pBot - pTop) * H;
  const plateau = new THREE.Mesh(slab({ w: gw, h: PH, d: 0.034, corner: C - (W - gw) / 2, bevel: 0.014, bevelSegments: 12 }), M.plateau);
  plateau.position.set(0, by((pTop + pBot) / 2), zB - 0.008);
  g.add(plateau);
  const zP = zB - 0.025;                                            // plateau outer surface
  // Plateau reflections (Apple's ref): bright glint along the top and left bevel, softer on the right and lower step,
  // plus a faint sheen that fades down the face. Baked additive overlay on the plateau's flat face.
  {
    const pb = 0.014, cw = gw - 2 * pb, ch = PH - 2 * pb, cr = Math.max(C - (W - gw) / 2 - pb, 0.001);
    const tw = 512, th = Math.round(512 * ch / cw), cv = document.createElement('canvas'); cv.width = tw; cv.height = th;
    const cx = cv.getContext('2d'), im = cx.createImageData(tw, th);
    for (let j = 0; j < th; j++) for (let i = 0; i < tw; i++) {
      const x = (i + 0.5) / tw * cw - cw / 2, y = ch / 2 - (j + 0.5) / th * ch;   // canvas row 0 = top of the face
      const qx = Math.abs(x) - (cw / 2 - cr), qy = Math.abs(y) - (ch / 2 - cr);
      const ox = Math.max(qx, 0), oy = Math.max(qy, 0), out = Math.hypot(ox, oy);
      const d = Math.max(-(out + Math.min(Math.max(qx, qy), 0) - cr), 0);       // distance inside the edge
      let nx = qx > 0 || qy > 0 ? ox * Math.sign(x) : (qx > qy ? Math.sign(x) : 0), ny = qx > 0 || qy > 0 ? oy * Math.sign(y) : (qy >= qx ? Math.sign(y) : 0);
      const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      // image-left in the back view is local -x (mesh is turned 180deg)
      const wdir = Math.max(ny, 0) * 1.0 + Math.max(-nx, 0) * 0.9 + Math.max(nx, 0) * 0.2 + Math.max(-ny, 0) * 1.0;
      const glint = 0.4 * wdir * Math.exp(-d / 0.0035);
      const sh = 0.0 * Math.pow(Math.max(0, (y + ch / 2) / ch), 2.0);
      const a = Math.min(1, glint + sh), k = (j * tw + i) * 4;
      im.data[k] = 255 * a; im.data[k + 1] = 255 * a * 0.82; im.data[k + 2] = 255 * a * 0.66; im.data[k + 3] = 255;
    }
    cx.putImageData(im, 0, 0);
    const rt = new THREE.CanvasTexture(cv); rt.colorSpace = THREE.NoColorSpace;
    const refl = new THREE.Mesh(new THREE.ShapeGeometry(roundedRect(cw, ch, cr), 48),
      new THREE.MeshBasicMaterial({ map: rt, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, toneMapped: false, polygonOffset: true, polygonOffsetFactor: -1 }));
    { const uv = refl.geometry.attributes.uv, pos = refl.geometry.attributes.position;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / cw + 0.5, pos.getY(i) / ch + 0.5); }
    refl.rotation.y = Math.PI; refl.position.set(0, by((pTop + pBot) / 2), zP - 0.0002); g.add(refl);
  }

  // Ceramic Shield glass panel: inset, frosted, same hue but softer/lighter
  const gTop = by(0.32), gBot = by(0.972);
  const glass = flat(gw, gTop - gBot, 0.07, M.back, 48);
  glass.rotation.y = Math.PI; glass.position.set(0, (gTop + gBot) / 2, zB - 0.0006); g.add(glass);
  // Studio "flag" falloff: Apple's glass darkens toward the bottom (light flagged off the lower half).
  // Baked as a soft multiply-style gradient so the top stays bright and the bottom settles ~30% darker.
  const flagCv = document.createElement('canvas'); flagCv.width = 4; flagCv.height = 256;
  const fg = flagCv.getContext('2d'), fgrad = fg.createLinearGradient(0, 0, 0, 256);
  fgrad.addColorStop(0, 'rgba(0,0,0,0.045)'); fgrad.addColorStop(0.35, 'rgba(0,0,0,0.01)'); fgrad.addColorStop(1, 'rgba(0,0,0,0.58)');
  fg.fillStyle = fgrad; fg.fillRect(0, 0, 4, 256);
  const flag = new THREE.Mesh(new THREE.ShapeGeometry(roundedRect(gw, gTop - gBot, 0.07), 48),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(flagCv), transparent: true, depthWrite: false, toneMapped: false, polygonOffset: true, polygonOffsetFactor: -1 }));
  { const uv = flag.geometry.attributes.uv, pos = flag.geometry.attributes.position, hh = (gTop - gBot) / 2;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, 0.5, (pos.getY(i) + hh) / (2 * hh)); }
  flag.rotation.y = Math.PI; flag.position.set(0, (gTop + gBot) / 2, zB - 0.0008); g.add(flag);

  // Apple logo: etched into the glass, slightly glossier than the frosted panel
  const logo = appleLogo(0.155, M.logo);
  logo.rotation.y = Math.PI; logo.position.set(0, by(0.64), zB - 0.0012); g.add(logo);

  // Three big lenses in a triangle with thick anodized rings (ring color = body color)
  const lens = (fx, fy) => {
    const x = bx(fx), y = by(fy);
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.083, 0.03, 96 * SEG), M.ring);
    ring.rotation.x = Math.PI / 2; ring.position.set(x, y, zP - 0.013); g.add(ring);
    const bevelRing = new THREE.Mesh(new THREE.TorusGeometry(0.0812, 0.0042, 20 * SEG, 128 * SEG), M.ring); // polished diamond-cut outer chamfer
    bevelRing.position.set(x, y, zP - 0.0275); g.add(bevelRing);
    const lip = new THREE.Mesh(new THREE.TorusGeometry(0.068, 0.006, 16 * SEG, 96 * SEG), M.ring); // chamfered inner lip
    lip.position.set(x, y, zP - 0.028); g.add(lip);
    const cover = new THREE.Mesh(new THREE.CylinderGeometry(0.066, 0.066, 0.03, 96 * SEG), M.lens);
    cover.rotation.x = Math.PI / 2; cover.position.set(x, y, zP - 0.0135); g.add(cover);
    // optics seen through the cover glass: concentric rings + small bright element
    const z = zP - 0.0287;
    [[0.05, M.lensIn], [0.036, M.lens], [0.022, M.lensIn], [0.009, M.lensCore]].forEach(([r, m], i) => {
      const d = disc(r, m, 64); d.rotation.y = Math.PI; d.position.set(x, y, z - i * 0.0002); g.add(d);
    });
  };
  lens(0.195, 0.083); lens(0.46, 0.147); lens(0.195, 0.21);

  // ---- Baked contact shadows (ambient occlusion) ----
  // Soft occlusion where surfaces meet, like Apple's renders: under each lens ring and below the plateau step.
  const aoTex = (fn, size = 128) => {
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const cx = cv.getContext('2d'), im = cx.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4; im.data[i] = im.data[i + 1] = im.data[i + 2] = 0;
      im.data[i + 3] = 255 * THREE.MathUtils.clamp(fn(x / (size - 1), y / (size - 1)), 0, 1);
    }
    cx.putImageData(im, 0, 0);
    return new THREE.CanvasTexture(cv);
  };
  const aoMat = (tex) => new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false, polygonOffset: true, polygonOffsetFactor: -2 });
  // ring base: dark halo just outside each ring, fading out over ~1.5 mm
  const ringR = 0.083, haloR = 0.105;
  const ringAO = aoMat(aoTex((u, v) => {
    const r = Math.hypot(u - 0.5, v - 0.5) * 2 * haloR;
    if (r < ringR || r > haloR) return 0;
    return 0.42 * Math.pow(1 - (r - ringR) / (haloR - ringR), 2);
  }));
  [[0.195, 0.083], [0.46, 0.147], [0.195, 0.21]].forEach(([fx, fy]) => {
    const d = new THREE.Mesh(new THREE.PlaneGeometry(haloR * 2, haloR * 2), ringAO);
    d.rotation.y = Math.PI; d.position.set(bx(fx), by(fy), zP - 0.0004); g.add(d);
  });
  // plateau step: occlusion falling onto the glass right under the plateau's lower edge
  const stepH = 0.07;
  const stepAO = aoMat(aoTex((u, v) => 0.38 * Math.pow(1 - v, 2.2) * Math.min(1, Math.min(u, 1 - u) * 12)));
  const step = new THREE.Mesh(new THREE.PlaneGeometry(gw * 0.94, stepH), stepAO);
  step.rotation.y = Math.PI; step.position.set(0, by(pBot) - stepH / 2, zB - 0.0009); g.add(step);

  // Flash (top right), mic dot, LiDAR (black, lower right)
  const flashM = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.004, 48), M.flash);
  flashM.rotation.x = Math.PI / 2; flashM.position.set(bx(0.81), by(0.08), zP - 0.0015); g.add(flashM);
  const mic = disc(0.005, M.hole, 16);
  mic.rotation.y = Math.PI; mic.position.set(bx(0.81), by(0.147), zP - 0.0006); g.add(mic);
  const lidar = disc(0.03, M.hole, 48);
  lidar.rotation.y = Math.PI; lidar.position.set(bx(0.81), by(0.215), zP - 0.0006); g.add(lidar);

  // ---- Sides ----
  const button = (x, y, h, mat = M.body, depth = 0.028, out = 0.004) => {
    const b = new THREE.Mesh(slab({ w: 0.012, h, d: depth, corner: Math.min(0.006, h / 2), bevel: 0.004 }), mat);
    b.position.set(x + Math.sign(x) * out, y, 0);
    g.add(b);
  };
  const L = -W / 2, R = W / 2;
  button(L, 0.43, 0.06);                 // Action button
  button(L, 0.3, 0.1);                   // volume up
  button(L, 0.17, 0.1);                  // volume down
  button(R, 0.3, 0.17);                  // side button
  button(R, -0.12, 0.11, M.sapphire, 0.026, 0.0005); // Camera Control: flush sapphire

  // ---- Bottom edge: USB-C, speaker + mic grilles ----
  const bottom = new THREE.Group();
  bottom.rotation.x = Math.PI / 2;       // faces -Y
  bottom.position.y = -H / 2 - 0.0008;
  const port = flat(0.09, 0.026, 0.013, M.hole); bottom.add(port);
  for (let i = 0; i < 6; i++) { const h = disc(0.0055, M.hole); h.position.set(0.085 + i * 0.022, 0, 0); bottom.add(h); }
  for (let i = 0; i < 4; i++) { const h = disc(0.0055, M.hole); h.position.set(-0.085 - i * 0.022, 0, 0); bottom.add(h); }
  g.add(bottom);
  // ---- Top edge: mmWave window ----
  const top = flat(0.1, 0.03, 0.015, M.window);
  top.rotation.x = -Math.PI / 2; top.position.set(-0.12, H / 2 + 0.0008, 0); g.add(top);

  return g;
}

/* =====================================================================
   6. Rig: pivot (alive motion) > product (normalized)
===================================================================== */
const pivot = new THREE.Group();
const product = new THREE.Group();
pivot.add(product);
scene.add(pivot);
let productHeight = 1;
const target = new THREE.Vector3(0, 0.5, 0);

const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {
  enableDamping: true, dampingFactor: 0.06, enablePan: false,
  minDistance: 0.5, maxDistance: 12, maxPolarAngle: Math.PI / 2 - 0.04,
  rotateSpeed: 0.7, zoomSpeed: 0.6,
});

function setProduct(obj) {
  product.clear();
  product.position.set(0, 0, 0);
  product.scale.setScalar(1);
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  product.add(obj);
  const box = new THREE.Box3().setFromObject(product);
  const size = box.getSize(new THREE.Vector3());
  product.scale.setScalar(1 / Math.max(size.x, size.y, size.z));
  box.setFromObject(product);
  const c = box.getCenter(new THREE.Vector3());
  product.position.set(-c.x, -box.min.y, -c.z);
  productHeight = box.max.y - box.min.y;
  target.set(0, productHeight / 2 + Theme.floatBase, 0);
  controls.target.copy(target);
}

/* =====================================================================
   7. Camera
===================================================================== */
function cameraPosFor(angle, padding = 1.3) {
  const a = Theme.angles[angle] ?? angle;
  if (a.dist) return new THREE.Vector3().setFromSphericalCoords(
    a.dist, THREE.MathUtils.degToRad(90 - a.elevation), THREE.MathUtils.degToRad(a.azimuth)
  ).add(viewTarget(a));
  const radius = Math.max(productHeight, 1) * 0.55;
  const vF = THREE.MathUtils.degToRad(camera.fov);
  const hF = 2 * Math.atan(Math.tan(vF / 2) * camera.aspect);
  const dist = (radius / Math.sin(Math.min(vF, hF) / 2)) * padding;
  return new THREE.Vector3().setFromSphericalCoords(
    dist, THREE.MathUtils.degToRad(90 - a.elevation), THREE.MathUtils.degToRad(a.azimuth)
  ).add(target);
}

const baseTarget = new THREE.Vector3();
function viewTarget(a) { return baseTarget.clone().setY(baseTarget.y + (a.lift ?? 0)); }
var viewKey = 1; // per-view key-light scale (Apple lights each angle separately)
function applyView(a) { // per-view fov + aim point (close-up aims at the camera plateau)
  camera.fov = a.fov ?? Theme.fov; camera.updateProjectionMatrix();
  viewKey = a.key ?? 1;
  try { applyRig(lighting, true); } catch (e) {} // rig not ready yet on first load
  target.copy(viewTarget(a)); controls.target.copy(target);
  controls.maxPolarAngle = a.elevation < 0 ? Math.PI - 0.05 : Math.PI / 2 - 0.04; // close-up looks up from below the horizon
}
let tweening = false;
let currentAngle = params.get('angle') ?? 'hero';
function goTo(angle, duration = 1.4) {
  currentAngle = angle;
  updateSummary();
  const a = Theme.angles[angle] ?? angle;
  if (!baseTarget.lengthSq()) baseTarget.copy(target);
  applyView(a);
  const to = cameraPosFor(angle);
  if (duration === 0) { camera.position.copy(to); camera.lookAt(target); return null; }
  tweening = true;
  controls.enabled = false;
  return gsap.to(camera.position, {
    x: to.x, y: to.y, z: to.z, duration, ease: 'power3.inOut',
    onUpdate: () => camera.lookAt(target),
    onComplete: () => { tweening = false; controls.enabled = true; },
  });
}

/* =====================================================================
   8. Behaviours (the "alive" part)
===================================================================== */
const pointer = new THREE.Vector2();
const pointerSmooth = new THREE.Vector2();
let lastInteract = performance.now();
let spinning = false;
let autoRotate = !STILL;
controls.addEventListener('start', () => { lastInteract = performance.now(); });

const raycaster = new THREE.Raycaster();
function hitProduct() {
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(product, true).length > 0;
}
canvas.addEventListener('pointermove', (e) => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  canvas.style.cursor = hitProduct() ? 'pointer' : 'grab';
});
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved < 5 && hitProduct()) spin();
});

function spin() {
  if (spinning) return;
  spinning = true;
  lastInteract = performance.now();
  gsap.to(pivot.rotation, { y: pivot.rotation.y + Math.PI * 2, duration: 1.6, ease: 'power3.inOut', onComplete: () => { spinning = false; } });
  gsap.timeline() // buoyancy: dunk, rise, settle like it's floating on water
    .to(pivot.position, { y: Theme.floatBase - 0.04, duration: 0.25, ease: 'power2.in' })
    .to(pivot.position, { y: Theme.floatBase + 0.1, duration: 0.45, ease: 'power2.out' })
    .to(pivot.position, { y: Theme.floatBase, duration: 1.4, ease: 'elastic.out(1, 0.3)' });
}

let screenOn = false;
function toggleScreen(on = !screenOn, instant = false) {
  screenOn = on;
  const v = on ? 1 : 0;
  if (instant) M.screen.color.setScalar(v);
  else gsap.to(M.screen.color, { r: v, g: v, b: v, duration: on ? 0.6 : 0.35, ease: 'power2.out' });
  if (screenBtn) { screenBtn.dataset.active = on ? '1' : ''; styleButton(screenBtn); }
  return screenOn;
}

let activeSwatch = params.get('color') ?? 'titanium';
function setColor(name, instant = false) {
  const c = new THREE.Color(Theme.colorways[name] ?? name);
  tinted.forEach((m) => {
    const t = m === M.plateau ? c.clone().multiplyScalar(0.97).multiply(new THREE.Color(1.0, 0.94, 0.90)) : m === M.back ? c.clone().multiplyScalar(1.15) : m === M.logo ? c.clone().multiplyScalar(1.18) : m === M.body ? c.clone().multiplyScalar(1.08) : c; // back glass: frosted, reads lighter than the anodized frame // plateau: lower env share (0.7), so a brighter base keeps it level with the ref (masked fit)
    if (instant) m.color.copy(t);
    else gsap.to(m.color, { r: t.r, g: t.g, b: t.b, duration: 0.8, ease: 'power2.inOut' });
  });
  activeSwatch = name;
  lastInteract = performance.now();
  if (swatches.length) styleSwatches();
  updateSummary();
}

let lighting = params.get('mode') === 'light' ? 'light' : 'dark'; // dark by default
const shadowFor = (mode) => (mode === 'dark' ? 0.0 : 0.1);
function applyRig(mode, instant) {
  Object.entries(lights).forEach(([name, l]) => {
    const v = l.userData.base * ModeRecipe[mode][name] * (name === 'key' ? viewKey : 1);
    if (instant) l.intensity = v; else gsap.to(l, { intensity: v, duration: 0.7 });
  });
}
function setLighting(mode, instant = false) {
  lighting = mode;
  paintUI(mode);
  applyRig(mode, instant);
  const bg = new THREE.Color(Theme.backdrop[mode]);
  if (instant) { vignette.uniforms.darkness.value = mode === 'dark' ? 0.9 : 0.35; scene.background = bg; scene.environment = envMaps[mode]; ground.material.opacity = shadowFor(mode); return null; }
  const tl = gsap.timeline();
  tl.to(renderer, { toneMappingExposure: 0.35, duration: 0.35, ease: 'power2.in', onComplete: () => { scene.environment = envMaps[mode]; } });
  tl.to(scene.background, { r: bg.r, g: bg.g, b: bg.b, duration: 0.7, ease: 'power2.inOut' }, 0);
  tl.to(renderer, { toneMappingExposure: EXPOSURE, duration: 0.6, ease: 'power2.out' });
  gsap.to(vignette.uniforms.darkness, { value: mode === 'dark' ? 0.9 : 0.35, duration: 0.7 });
  return tl;
}

/* =====================================================================
   9. Capture (always centered: view offset cleared)
===================================================================== */
function shot({ scale = 2, transparent = false } = {}) {
  const prevPR = renderer.getPixelRatio();
  const prevBg = scene.background;
  if (transparent) scene.background = null;
  camera.zoom = 1;
  camera.clearViewOffset();
  renderer.setPixelRatio(scale);
  if (transparent) renderer.render(scene, camera); // keep alpha: skip post
  else { composer.setPixelRatio(scale); composer.setSize(innerWidth, innerHeight); composer.render(); }
  const url = renderer.domElement.toDataURL('image/png');
  renderer.setPixelRatio(prevPR);
  composer.setPixelRatio(prevPR); composer.setSize(innerWidth, innerHeight);
  scene.background = prevBg;
  return url;
}
function captureAndDownload() {
  const url = shot({ scale: 3 });
  gsap.fromTo(flashEl, { opacity: 0.85 }, { opacity: 0, duration: 0.6, ease: 'power2.out' });
  make('a', {}, { href: url, download: `product-shot-${Date.now()}.png` }).click();
}

function group(label, style) {
  const gEl = make('div', Style.group);
  gEl.append(make('div', Style.label, { textContent: label }));
  const body = make('div', style);
  gEl.append(body);
  bodyEl.append(gEl);
  currentParent = body;
  return body;
}
function button(label, onClick) {
  const b = make('button', Style.btn, { textContent: label });
  b.addEventListener('mouseenter', () => { if (!b.dataset.active) b.style.background = skin().hover; });
  b.addEventListener('mouseleave', () => styleButton(b));
  b.addEventListener('pointerdown', () => { b.style.transform = 'scale(0.94)'; });
  b.addEventListener('pointerup', () => { b.style.transform = 'scale(1)'; });
  b.addEventListener('pointerleave', () => { b.style.transform = 'scale(1)'; });
  b.addEventListener('click', onClick);
  currentParent.append(b);
  buttons.push(b);
  return b;
}
function setActive(map, keyName) {
  Object.entries(map).forEach(([k, b]) => { b.dataset.active = k === keyName ? '1' : ''; styleButton(b); });
}
function styleSwatches() {
  const k = skin();
  swatches.forEach((s) => {
    const on = s.dataset.swatch === activeSwatch;
    s.style.borderColor = on ? k.swatchOn : k.swatchRing;
    s.style.transform = on ? 'scale(1.18)' : 'scale(1)';
  });
}
function updateSummary() { summaryEl.textContent = `${currentAngle} / ${activeSwatch}`; }

const segmentEl = group('View', Style.segment);
Object.keys(Theme.angles).forEach((name) => {
  angleBtns[name] = button(name[0].toUpperCase() + name.slice(1), () => { goTo(name); setActive(angleBtns, name); lastInteract = performance.now(); });
});
const swatchRowEl = group('Finish', Style.swatchRow);
Object.entries(Theme.colorways).forEach(([name, hex]) => {
  const s = make('button', { ...Style.swatch, background: hex }, { title: name });
  s.dataset.swatch = name;
  s.addEventListener('click', () => setColor(name));
  swatchRowEl.append(s);
  swatches.push(s);
});
group('Studio', Style.actions);
lightBtn = button('Light', () => setLighting(lighting === 'light' ? 'dark' : 'light'));
screenBtn = button('Screen', () => toggleScreen());
const autoBtn = button('Auto', () => { autoRotate = !autoRotate; autoBtn.dataset.active = autoRotate ? '1' : ''; styleButton(autoBtn); });
autoBtn.dataset.active = autoRotate ? '1' : '';
const captureBtn = make('button', Style.primary, { textContent: 'Capture shot' });
captureBtn.addEventListener('pointerdown', () => { captureBtn.style.transform = 'scale(0.97)'; });
captureBtn.addEventListener('pointerup', () => { captureBtn.style.transform = 'scale(1)'; });
captureBtn.addEventListener('pointerleave', () => { captureBtn.style.transform = 'scale(1)'; });
captureBtn.addEventListener('click', captureAndDownload);
bodyEl.append(captureBtn);

function paintUI(mode) {
  const k = Skin[mode];
  Object.assign(sheetEl.style, { background: k.sheetBg, border: `1px solid ${k.sheetBorder}`, color: k.text, boxShadow: k.shadow });
  gripEl.style.background = k.grip;
  segmentEl.style.background = k.track;
  Object.assign(captureBtn.style, { background: k.primaryBg, color: k.primaryText });
  wordmarkEl.style.color = k.text;
  hintEl.style.color = k.hint;
  buttons.forEach(styleButton);
  styleSwatches();
  if (lightBtn) lightBtn.textContent = mode === 'light' ? 'Dark' : 'Light';
}

// ---- Drawer physics: drag the header, flick or tap to open/close ----
const sheet = { y: 0 };            // 0 = open, closedY = only the header peeks
let closedY = 0, drawerOpen = !params.has('closed');
function measureSheet() { closedY = bodyEl.offsetHeight; }
function applySheet() {
  sheetEl.style.transform = `translate(-50%, ${sheet.y}px)`;
  bodyEl.style.opacity = closedY ? String(THREE.MathUtils.clamp(1 - sheet.y / closedY, 0, 1)) : '1';
  gripEl.style.width = drawerOpen ? '36px' : '44px';
}
function setDrawer(open, instant = false) {
  drawerOpen = open;
  const y = open ? 0 : closedY;
  gsap.killTweensOf(sheet);
  if (instant) { sheet.y = y; applySheet(); return; }
  gsap.to(sheet, { y, duration: 0.6, ease: 'elastic.out(1, 0.85)', onUpdate: applySheet });
  applySheet();
}
let drag = null;
headerEl.addEventListener('pointerdown', (e) => {
  drag = { y0: e.clientY, s0: sheet.y, last: e.clientY, v: 0, moved: false };
  headerEl.setPointerCapture(e.pointerId);
  headerEl.style.cursor = 'grabbing';
  gsap.killTweensOf(sheet);
});
headerEl.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  if (Math.abs(dy) > 4) drag.moved = true;
  let y = drag.s0 + dy;
  if (y < 0) y *= 0.25;                                  // rubber band past open
  if (y > closedY) y = closedY + (y - closedY) * 0.25;   // rubber band past closed
  drag.v = e.clientY - drag.last; drag.last = e.clientY;
  sheet.y = y; applySheet();
});
const endDrag = () => {
  if (!drag) return;
  const d = drag; drag = null;
  headerEl.style.cursor = 'grab';
  if (!d.moved) return setDrawer(!drawerOpen);
  setDrawer(d.v < -2 ? true : d.v > 2 ? false : sheet.y < closedY / 2);
};
headerEl.addEventListener('pointerup', endDrag);
headerEl.addEventListener('pointercancel', endDrag);
headerEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setDrawer(!drawerOpen); } });

// The scene makes room for the drawer: shift the frame up by half the covered height
const view = { shift: 0, zoom: 1 };
function sceneShiftTarget() {
  if (params.has('noui')) return 0;
  const covered = sheetEl.offsetHeight - sheet.y + 12;
  return Math.max(0, covered * 0.5);
}

/* =====================================================================
   11. Loop
===================================================================== */
const t0 = performance.now();
let stillFrames = 0;
function tick() {
  const t = (performance.now() - t0) / 1000;
  const idle = performance.now() - lastInteract > 3500;
  if (!STILL) {
    if (!spinning) pivot.position.y = Theme.floatBase + Math.sin(t * 1.1) * 0.015; // breathing float
    if (autoRotate && idle && !spinning) pivot.rotation.y += 0.0025;                  // idle turntable
    pointerSmooth.lerp(pointer, 0.05);                                                 // parallax tilt
    pivot.rotation.x = -pointerSmooth.y * 0.05;
    pivot.rotation.z = pointerSmooth.x * -0.035;
    if (lighting === 'light') ground.material.opacity = 0.1 - (pivot.position.y - Theme.floatBase) * 0.3;
  }
  // Fit the product into the free area above the drawer: shift up + gently zoom out
  const covered = sceneShiftTarget() * 2;
  const k = STILL ? 1 : 0.12;
  view.shift += (covered * 0.5 - view.shift) * k;
  view.zoom += (THREE.MathUtils.clamp((innerHeight - covered) / innerHeight, 0.55, 1) - view.zoom) * k;
  camera.zoom = view.zoom;
  camera.setViewOffset(innerWidth, innerHeight, 0, view.shift, innerWidth, innerHeight);
  if (!tweening) controls.update();
  syncRig();
  if (!STILL || stillFrames++ < 3) composer.render(); // still mode idles after a few frames
  requestAnimationFrame(tick);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  measureSheet();
  setDrawer(drawerOpen, true);
});

/* =====================================================================
   12. Boot + intro
===================================================================== */
async function loadModel(url) {
  const gltf = await new GLTFLoader().loadAsync(url);
  setProduct(gltf.scene);
}
if (params.get('model')) await loadModel(params.get('model'));
else setProduct(buildPhone());

pivot.position.y = Theme.floatBase;
setLighting(lighting, true);
setColor(activeSwatch, true);
if (params.has('screen')) toggleScreen(true, true);
camera.aspect = innerWidth / innerHeight;
camera.updateProjectionMatrix();
setActive(angleBtns, currentAngle);
if (params.get('rot')) pivot.rotation.y = THREE.MathUtils.degToRad(+params.get('rot'));
measureSheet();
document.fonts?.ready.then(() => { measureSheet(); setDrawer(drawerOpen, true); });

if (STILL) {
  setDrawer(drawerOpen, true);
  goTo(currentAngle, 0);
} else {
  sheet.y = sheetEl.offsetHeight + 40; applySheet();   // drawer rises in after the camera move
  camera.position.copy(cameraPosFor({ azimuth: 200, elevation: 22 }, 2.2));
  camera.lookAt(target);
  gsap.timeline()
    .from(pivot.rotation, { y: -Math.PI * 0.75, duration: 2.0, ease: 'expo.out' }, 0)
    .add(goTo(currentAngle, 2.0), 0.1)
    .add(() => setDrawer(drawerOpen), 1.1);
}
tick();

/* =====================================================================
   13. Agent API
===================================================================== */
window.studio = {
  THREE, scene, camera, renderer, target, composer, bloom, vignette, modeRecipe: ModeRecipe, materials: M, theme: Theme, threePoint: ThreePoint, lights,
  // re-light after editing modeRecipe / threePoint (used by the ref-matching tuner)
  relight: () => {
    envMaps.light = buildStudioEnv('light'); envMaps.dark = buildStudioEnv('dark');
    scene.environment = envMaps[lighting]; applyRig(lighting, true);
  },
  goTo, spin, setColor, setLighting, toggleScreen, shot, loadModel, setDrawer,
  build: (fn) => setProduct(fn({ THREE, slab, roundedRect, materials: M })),
  setAutoRotate: (on) => { autoRotate = on; },
  ready: true,
};
</script>
</body>
